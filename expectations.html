<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivya | Partner Expectations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0D1B2A',
                        gold: '#C9A84C',
                        cream: '#FAF7F2',
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'serif'],
                        sans: ['DM Sans', 'sans-serif'],
                    },
                    animation: {
                        'shimmer': 'shimmer 2.5s infinite linear',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-200% center' },
                            '100%': { backgroundPosition: '200% center' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF7F2;
            font-family: 'DM Sans', sans-serif;
            color: #0D1B2A;
            -webkit-font-smoothing: antialiased;
        }

        .serif-heading {
            font-family: 'Cormorant Garamond', serif;
        }

        .card-select {
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card-select.selected {
            background-color: rgba(201, 168, 76, 0.05);
            border-color: #C9A84C;
            transform: scale(0.98);
        }

        .pill-select {
            transition: all 0.2s ease;
        }

        .pill-select.selected {
            background-color: #C9A84C;
            color: #0D1B2A;
            border-color: #C9A84C;
        }

        .shimmer-btn {
            background: linear-gradient(90deg, #C9A84C 0%, #d4bb73 25%, #C9A84C 50%, #d4bb73 75%, #C9A84C 100%);
            background-size: 200% auto;
        }

        input:focus,
        textarea:focus {
            border-color: #C9A84C !important;
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.1) !important;
            outline: none;
        }

        .error-shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }
    </style>
</head>

<body class="min-h-screen py-20 px-6 flex flex-col items-center">

    <!-- Logo and Progress -->
    <div class="w-full max-w-4xl flex flex-col items-center mb-16">
        <h1 class="text-3xl font-serif font-bold tracking-tight mb-12">
            Driv<span class="text-gold">ya</span>
        </h1>

        <div class="flex items-center gap-6">
            <div class="flex flex-col items-center gap-2">
                <div
                    class="w-8 h-8 rounded-full border border-gold bg-gold/5 flex items-center justify-center text-gold">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <span class="text-[9px] uppercase tracking-[0.2em] font-bold text-navy/40">Your Role</span>
            </div>
            <div class="w-12 h-[1px] bg-gold/30 mb-5"></div>
            <div class="flex flex-col items-center gap-2">
                <div
                    class="w-8 h-8 rounded-full border border-gold bg-gold/5 flex items-center justify-center text-gold">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <span class="text-[9px] uppercase tracking-[0.2em] font-bold text-navy/40">Your Profile</span>
            </div>
            <div class="w-12 h-[1px] bg-gold/30 mb-5"></div>
            <div class="flex flex-col items-center gap-2">
                <div
                    class="w-8 h-8 rounded-full bg-gold flex items-center justify-center text-navy font-bold text-sm shadow-lg shadow-gold/20 relative z-10">
                    3
                </div>
                <span class="text-[9px] uppercase tracking-[0.2em] font-bold text-gold">Your Goals</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="w-full max-w-4xl">
        <div class="text-center mb-16">
            <h2 class="text-5xl md:text-6xl serif-heading font-semibold mb-6">What are you looking for in a partner?
            </h2>
            <p class="text-lg text-navy/60 max-w-xl mx-auto font-sans">
                Select everything that applies. This shapes your Drivya Match Score.
            </p>
        </div>

        <form id="expectationsForm" class="space-y-20">

            <!-- SECTION 1: Partnership Type -->
            <div class="space-y-6">
                <label class="text-[11px] uppercase tracking-[0.2em] font-bold text-navy/60 block mb-8">I am looking
                    for...</label>
                <div id="partnershipTypes" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <button type="button" onclick="toggleSelection(this, 'partnership')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm flex flex-col items-center justify-center text-center gap-3 hover:border-navy/20">
                        <span class="text-2xl">💰</span>
                        <span class="text-xs font-bold leading-tight">Funding / Grants</span>
                    </button>
                    <button type="button" onclick="toggleSelection(this, 'partnership')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm flex flex-col items-center justify-center text-center gap-3 hover:border-navy/20">
                        <span class="text-2xl">🤝</span>
                        <span class="text-xs font-bold leading-tight">Implementation Partner</span>
                    </button>
                    <button type="button" onclick="toggleSelection(this, 'partnership')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm flex flex-col items-center justify-center text-center gap-3 hover:border-navy/20">
                        <span class="text-2xl">🏗️</span>
                        <span class="text-xs font-bold leading-tight">Incubation Support</span>
                    </button>
                    <button type="button" onclick="toggleSelection(this, 'partnership')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm flex flex-col items-center justify-center text-center gap-3 hover:border-navy/20">
                        <span class="text-2xl">📋</span>
                        <span class="text-xs font-bold leading-tight">CSR Compliance Partner</span>
                    </button>
                    <button type="button" onclick="toggleSelection(this, 'partnership')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm flex flex-col items-center justify-center text-center gap-3 hover:border-navy/20">
                        <span class="text-2xl">🌍</span>
                        <span class="text-xs font-bold leading-tight">Geographic Expansion</span>
                    </button>
                    <button type="button" onclick="toggleSelection(this, 'partnership')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm flex flex-col items-center justify-center text-center gap-3 hover:border-navy/20">
                        <span class="text-2xl">📣</span>
                        <span class="text-xs font-bold leading-tight">Advocacy & Awareness</span>
                    </button>
                    <button type="button" onclick="toggleSelection(this, 'partnership')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm flex flex-col items-center justify-center text-center gap-3 hover:border-navy/20">
                        <span class="text-2xl">🔬</span>
                        <span class="text-xs font-bold leading-tight">Research Collaboration</span>
                    </button>
                    <button type="button" onclick="toggleSelection(this, 'partnership')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm flex flex-col items-center justify-center text-center gap-3 hover:border-navy/20">
                        <span class="text-2xl">🎓</span>
                        <span class="text-xs font-bold leading-tight">Capacity Building</span>
                    </button>
                </div>
                <p id="partnershipError"
                    class="text-red-500 text-[10px] font-bold uppercase tracking-widest hidden mt-4">Please select at
                    least one partnership type</p>
            </div>

            <!-- SECTION 2: Budget Range -->
            <div class="space-y-8">
                <label class="text-[11px] uppercase tracking-[0.2em] font-bold text-navy/60 block">Expected
                    collaboration budget</label>
                <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="selectSingle(this, 'pill')"
                        class="pill-select px-6 py-3 rounded-full border border-navy/10 text-xs font-bold hover:border-navy/30">Under
                        ₹5L</button>
                    <button type="button" onclick="selectSingle(this, 'pill')"
                        class="pill-select px-6 py-3 rounded-full border border-navy/10 text-xs font-bold hover:border-navy/30">₹5L
                        – ₹25L</button>
                    <button type="button" onclick="selectSingle(this, 'pill')"
                        class="pill-select px-6 py-3 rounded-full border border-navy/10 text-xs font-bold hover:border-navy/30">₹25L
                        – ₹1Cr</button>
                    <button type="button" onclick="selectSingle(this, 'pill')"
                        class="pill-select px-6 py-3 rounded-full border border-navy/10 text-xs font-bold hover:border-navy/30">₹1Cr
                        – ₹5Cr</button>
                    <button type="button" onclick="selectSingle(this, 'pill')"
                        class="pill-select px-6 py-3 rounded-full border border-navy/10 text-xs font-bold hover:border-navy/30">₹5Cr+</button>
                </div>
            </div>

            <!-- SECTION 3: Timeline -->
            <div class="space-y-8">
                <label class="text-[11px] uppercase tracking-[0.2em] font-bold text-navy/60 block">When do you want to
                    start?</label>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button type="button" onclick="selectSingle(this, 'timeline')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm text-left group hover:border-navy/20">
                        <span class="text-2xl mb-4 block group-hover:scale-110 transition-transform">🚀</span>
                        <p class="text-sm font-bold mb-1">Immediately</p>
                        <p class="text-[11px] text-navy/40">(within 1 month)</p>
                    </button>
                    <button type="button" onclick="selectSingle(this, 'timeline')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm text-left group hover:border-navy/20">
                        <span class="text-2xl mb-4 block group-hover:scale-110 transition-transform">📅</span>
                        <p class="text-sm font-bold mb-1">Soon</p>
                        <p class="text-[11px] text-navy/40">(1–3 months)</p>
                    </button>
                    <button type="button" onclick="selectSingle(this, 'timeline')"
                        class="card-select p-6 bg-white border border-navy/5 rounded-sm text-left group hover:border-navy/20">
                        <span class="text-2xl mb-4 block group-hover:scale-110 transition-transform">🗓️</span>
                        <p class="text-sm font-bold mb-1">Planning ahead</p>
                        <p class="text-[11px] text-navy/40">(3–6 months)</p>
                    </button>
                </div>
            </div>

            <!-- SECTION 4: Optional Text -->
            <div class="space-y-4">
                <label class="text-[11px] uppercase tracking-[0.2em] font-bold text-navy/60 block">Anything specific you
                    want in a partner? (Optional)</label>
                <textarea rows="3" placeholder="E.g. Must have worked in rural UP, looking for 3 year commitment..."
                    class="w-full px-0 py-4 border-b border-navy/10 bg-transparent text-lg transition-all resize-none placeholder:text-navy/20"></textarea>
            </div>

            <!-- Bottom Nav -->
            <div class="pt-20 flex flex-col md:flex-row items-center justify-between gap-12">
                <a href="org-profile.html"
                    class="text-sm font-bold uppercase tracking-widest text-navy/40 hover:text-navy transition-colors">←
                    Back</a>

                <div class="flex flex-col items-center md:items-end gap-4">
                    <button type="button" onclick="verifyAndProceed()"
                        class="shimmer-btn animate-shimmer px-12 py-6 bg-gold text-navy rounded-sm font-bold text-sm uppercase tracking-widest hover:brightness-110 active:scale-[0.98] transition-all shadow-xl shadow-gold/20">
                        Show My Matches →
                    </button>
                    <p class="text-[10px] text-navy/30 font-medium">You can update your preferences anytime from your
                        profile.</p>
                </div>
            </div>

        </form>
    </main>

    <script>
        function toggleSelection(el, group) {
            el.classList.toggle('selected');
            document.getElementById('partnershipError').classList.add('hidden');
            document.getElementById('partnershipTypes').classList.remove('error-shake');
        }

        function selectSingle(el, group) {
            let container = el.parentElement;
            if (group === 'timeline') {
                container.querySelectorAll('.card-select').forEach(card => card.classList.remove('selected'));
            } else {
                container.querySelectorAll('.pill-select').forEach(pill => pill.classList.remove('selected'));
            }
            el.classList.add('selected');
        }

        function verifyAndProceed() {
            const selectedPartnerships = document.querySelectorAll('#partnershipTypes .selected');

            if (selectedPartnerships.length === 0) {
                document.getElementById('partnershipError').classList.remove('hidden');
                document.getElementById('partnershipTypes').classList.add('error-shake');
                document.getElementById('partnershipTypes').scrollIntoView({ behavior: 'smooth', block: 'center' });

                setTimeout(() => {
                    document.getElementById('partnershipTypes').classList.remove('error-shake');
                }, 500);

                return;
            }

            // Redirect on success
            window.location.href = 'profile-complete.html';
        }
    </script>

</body>

</html>
